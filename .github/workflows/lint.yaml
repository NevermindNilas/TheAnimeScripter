name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run when a newer commit lands on the same ref.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    # Ruff is a standalone binary and the checks are platform-agnostic, so the
    # cheaper/faster Linux runner is fine for these source checks.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Create lint environment
        run: uv venv

      # Pin ruff: formatter output and lint rules can shift between releases, so
      # the version here must match what contributors run locally.
      - name: Install ruff
        run: uv pip install ruff==0.15.16

      # Discovery mode (no explicit paths) so the excludes in pyproject.toml apply.
      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Format check
        run: uv run ruff format --check

  ty:
    # Catches names that do not exist — the failure mode the backend `match`
    # tables are prone to, where an arm lazily imports a class that was renamed
    # or never written and nothing fails until a user picks that CLI choice.
    # Ruff cannot see inside those lazy imports.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Create lint environment
        run: uv venv

      # Pin ty: it is pre-1.0, so rule names and default severities still move.
      - name: Install ty
        run: uv pip install ty==0.0.63

      # The TAS dependency set (torch, tensorrt, onnxruntime EPs) is far too
      # heavy to install just to lint, so this runs against a bare venv. ty
      # still resolves first-party modules from the filesystem, so
      # "Module `src.x` has no member `Y`" fires exactly as it does locally
      # with the full environment — verified against the three dead imports
      # this job was added for.
      #
      # What a bare venv *cannot* judge is third-party imports, so the gate is
      # deliberately narrow: only src.* missing-member errors and undefined
      # first-party names fail. "Cannot resolve imported module torch" and the
      # like are expected here and must not fail the build.
      - name: Type check
        run: |
          uv run ty check --output-format=concise --exit-zero | tee ty.log
          if grep -E 'error\[unresolved-import\] Module `src\.[^`]*` has no member|error\[unresolved-reference\]' ty.log; then
            echo "::error::ty found a first-party name that does not exist (see above)"
            exit 1
          fi

  py315:
    # TAS ships on 3.14, but the move to 3.15 is blocked only on native wheels
    # (nelux, rife_ncnn, onnxruntime, tensorrt, ...), not on our code. This job
    # keeps it that way, so the switch is a pin bump once those wheels exist.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Newer than the other jobs' uv: 0.11.28's download list predates the
          # 3.15.0 release and silently resolves "3.15" to 3.15.0b3. The exact
          # pin makes a uv that cannot provide 3.15.0 fail instead.
          version: "0.13.1"
          python-version: "3.15.0"
          enable-cache: true

      - name: Create lint environment
        run: uv venv

      - name: Install ty
        run: uv pip install ty==0.0.63

      # -W error turns SyntaxWarnings (invalid escapes, return in finally, ...)
      # into failures. Vendored trees are included on purpose: they run on 3.15 too.
      - name: Compile under 3.15
        run: uv run python -W error -m compileall -q -x '(^|/)\.venv/' .

      # Same bare venv as the ty job, so third-party imports are unresolvable on
      # both versions. Diffing a 3.14 run against a 3.15 run cancels that noise
      # and leaves only what 3.15 itself breaks, e.g. a removed stdlib module or
      # member ("Module `typing` has no member `no_type_check_decorator`").
      - name: Type check against 3.15 stdlib
        run: |
          uv run ty check --python-version 3.14 --output-format=concise --exit-zero | grep -F ': error[' | sort > ty-314.log || true
          uv run ty check --python-version 3.15 --output-format=concise --exit-zero | grep -F ': error[' | sort > ty-315.log || true
          if comm -13 ty-314.log ty-315.log | grep .; then
            echo "::error::ty reports errors under Python 3.15 that 3.14 does not (see above)"
            exit 1
          fi
