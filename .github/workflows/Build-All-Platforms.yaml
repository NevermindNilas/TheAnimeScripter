name: Build-All-Platforms

on:
  workflow_dispatch:

permissions:
  contents: write

# One release build at a time. Two runs of the same version would both pass the
# "already published" check and then race each other onto the GitHub release.
concurrency:
  group: build-all-platforms
  cancel-in-progress: false

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_nodots: ${{ steps.get_version.outputs.version_nodots }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14.10"
          version: "0.13.6"
          enable-cache: true

      - name: Extract version
        id: get_version
        run: |
          version=$(uv run --no-project python -c 'import src.version; print(src.version.__version__)')
          version_nodots=${version//./}
          echo "version=${version}" >> $GITHUB_ENV
          echo "version_nodots=${version_nodots}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "version_nodots=${version_nodots}" >> $GITHUB_OUTPUT

      - name: Print version
        id: print_version
        run: echo ${{ steps.get_version.outputs.version }}

      # A version already on the update host cannot be replaced, and a rebuild is never
      # byte-identical. Stop before anything is rebuilt, so the GitHub release cannot end
      # up with different archives than the update host. To retry a failed publish_cdn,
      # use "Re-run failed jobs", which skips this job.
      - name: Refuse a version that cannot be published
        run: |
          version="${{ steps.get_version.outputs.version }}"
          # curl fails the step on an outage or a missing index: nothing is built against an unknown host state.
          curl -fsS --retry 3 -o "$RUNNER_TEMP/engine-index.json" https://updates.nevermindnilas.dev/engine/stable/index.json
          VERSION="$version" python3 - "$RUNNER_TEMP/engine-index.json" <<'PY'
          import json, os, re, sys

          version = os.environ["VERSION"]
          strict = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$")
          if not strict.match(version):
              sys.exit(f"::error::src/version.py says {version!r}; a release version must be X.Y.Z with no leading zeros.")
          try:
              index = json.load(open(sys.argv[1], encoding="utf-8"))
              releases, retired = index["releases"], index.get("retired", [])
              published = [r["version"] for r in releases] + [r["version"] for r in retired]
          except Exception as error:  # an unreadable index must stop the build, not wave it through
              sys.exit(f"::error::engine/stable/index.json on the update host is not readable ({error}).")
          key = lambda v: tuple(int(p) for p in v.split("-")[0].split("."))
          if version in published:
              sys.exit(f"::error::Engine {version} was already published on the update host and a version can never be replaced. Bump src/version.py, or use 'Re-run failed jobs' to retry a failed job of the original run.")
          newer = [v for v in published if key(v) >= key(version)]
          if newer:
              sys.exit(f"::error::Engine {version} is not higher than {max(newer, key=key)}, which the update host has already published.")
          print(f"Engine {version} has not been published; highest so far: {max(published, key=key) if published else 'none'}.")
          PY

      - name: Extract changelog for current version
        id: get_changelog
        run: |
          version="${{ steps.get_version.outputs.version }}"
          # Extract changelog content for the current version
          # Falls back to [Unreleased] section if version not found
          changelog=$(uv run --no-project python -c "
          import re
          
          version = '${version}'
          
          with open('CHANGELOG.MD', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # First try to find the exact version section
          pattern = rf'##\s*\[{re.escape(version)}\].*?(?=\n##\s*\[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          
          # If not found, try to use [Unreleased] section
          if not match:
              unreleased_pattern = r'##\s*\[Unreleased\].*?(?=\n##\s*\[|\Z)'
              match = re.search(unreleased_pattern, content, re.DOTALL)
          
          if match:
              # Replace [Unreleased] header with version header if using unreleased section
              result = match.group(0).strip()
              if '[Unreleased]' in result:
                  result = result.replace('[Unreleased]', f'[{version}]', 1)
              print(result)
          else:
              print('No changelog entry found for version ' + version)
          ")
          
          # Write to file for multiline support
          echo "$changelog" > /tmp/changelog.txt
          echo "changelog_path=/tmp/changelog.txt" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TAS }}
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body_path: ${{ steps.get_changelog.outputs.changelog_path }}
          draft: true

      - name: Upload release notes for the update host
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/changelog.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build_windows:
    needs: create_release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14.10"
          version: "0.13.6"
          enable-cache: true

      - name: Run full build script
        run: uv run --no-project python build.py

      - name: Compress full directory
        run: |
          cd ${{ github.workspace }}/dist-portable/main/
          Compress-Archive -Path * -DestinationPath ../../TAS-${{ needs.create_release.outputs.version_nodots }}-Windows.zip

      - name: Upload Release Asset
        id: upload-release-asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TAS }}
        with:
          tag_name: v${{ needs.create_release.outputs.version }}
          files: TAS-${{ needs.create_release.outputs.version_nodots }}-Windows.zip
          draft: true

      # The same archive, handed to publish_cdn below.
      - name: Upload archive for the update host
        uses: actions/upload-artifact@v4
        with:
          name: cdn-windows
          path: TAS-${{ needs.create_release.outputs.version_nodots }}-Windows.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0

  build_macos:
    needs: create_release
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14.10"
          version: "0.13.6"
          enable-cache: true

      - name: Run full build script
        run: uv run --no-project python build.py

      - name: Compress full directory
        run: |
          cd "${{ github.workspace }}/dist-portable/main/"
          zip -r "../../TAS-${{ needs.create_release.outputs.version_nodots }}-macOS-arm64.zip" .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TAS }}
        with:
          tag_name: v${{ needs.create_release.outputs.version }}
          files: TAS-${{ needs.create_release.outputs.version_nodots }}-macOS-arm64.zip
          draft: true

      # The same archive, handed to publish_cdn below.
      - name: Upload archive for the update host
        uses: actions/upload-artifact@v4
        with:
          name: cdn-macos
          path: TAS-${{ needs.create_release.outputs.version_nodots }}-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0

