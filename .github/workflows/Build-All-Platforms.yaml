  #      run: |
  #        cd ${{ github.workspace }}/dist-lite/main/
  #        7z a -t7z -m0=lzma2 -mx=9 -ms=1536m -md=1024m ../../TAS-${{ needs.create_release.outputs.version }}-Lite-Windows.7z *
#
