  #      id: upload-release-asset
  #      uses: actions/upload-release-asset@v1
  #      env:
  #        GITHUB_TOKEN: ${{ secrets.TAS }}
  #      with:
  #        upload_url: ${{ needs.create_release.outputs.upload_url }}
  #        asset_path: TAS-${{ needs.create_release.outputs.version }}-Lite-Windows.7z
  #        asset_name: TAS-${{ needs.create_release.outputs.version }}-Lite-Windows.7z
  #        asset_content_type: application/x-7z-compressed

  build_linux:
    needs: create_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14.10"
          version: "0.13.6"
          enable-cache: true

      - name: Run full build script
        run: uv run --no-project python build.py

      # tar, not zip: run.sh and bin/python3 must stay executable.
      - name: Compress full directory
        run: |
          cd "${{ github.workspace }}/dist-portable/main/"
          tar -czf "../../TAS-${{ needs.create_release.outputs.version_nodots }}-Linux-x86_64.tar.gz" .

      # linux-lite peaks around 10 GB while pip unpacks it.
      - name: Prepare runner for the smoke test
        run: sudo rm -rf /usr/local/lib/android

      - name: Smoke test the archive
        run: bash .github/scripts/smoke-linux-bundle.sh "TAS-${{ needs.create_release.outputs.version_nodots }}-Linux-x86_64.tar.gz" "$RUNNER_TEMP/tas-smoke"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.TAS }}
        with:
          tag_name: v${{ needs.create_release.outputs.version }}
          files: TAS-${{ needs.create_release.outputs.version_nodots }}-Linux-x86_64.tar.gz
          draft: true

      # The same archive, handed to publish_cdn below.
      - name: Upload archive for the update host
        uses: actions/upload-artifact@v4
        with:
          name: cdn-linux
          path: TAS-${{ needs.create_release.outputs.version_nodots }}-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: true
          compression-level: 0

  # Publishes the three archives to the update host (https://updates.nevermindnilas.dev),
  # which is where the frontends download the engine from. It runs only after every
  # platform built, so a release is never half there. The frontends cannot publish a
  # build pinned to this version until this job has succeeded.
  #
  # The GitHub release stays a draft. Publish it by hand once sync-frontends.yml has
  # attached the Standalone and Adobe builds pinned to this version.
  publish_cdn:
    needs: [create_release, build_windows, build_macos, build_linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the archives
        uses: actions/download-artifact@v4
        with:
          path: cdn
          merge-multiple: true

      - name: Publish to the update host
        env:
          CDN_PUBLISH_TOKEN: ${{ secrets.CDN_PUBLISH_TOKEN }}
          VERSION: ${{ needs.create_release.outputs.version }}
          NODOTS: ${{ needs.create_release.outputs.version_nodots }}
        run: |
          node .github/scripts/cdn-publish.mjs release \
            --product engine --channel stable --version "$VERSION" \
            --file "windows:zip:cdn/TAS-$NODOTS-Windows.zip" \
            --file "macos:zip:cdn/TAS-$NODOTS-macOS-arm64.zip" \
            --file "linux:tar.gz:cdn/TAS-$NODOTS-Linux-x86_64.tar.gz" \
            --notes-file cdn/changelog.txt
